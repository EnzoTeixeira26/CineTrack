# Branch Main

# Modelo Local personalizado e documentado para leigos feito também por um leigo (Antônio Teixeira)

spring.application.name=cinetrack

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cinetrack}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.datasource.driverClassName=org.postgresql.Driver

spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}

# PADRONIZA A LINGUAGEM SQL DE UM SGBD ESPECIFICO
spring.jpa.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=none

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true


spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


jwt.secret=${JWT_SECRET:dev-only-secret-change-in-production-min-32-bytes-long}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


# Habilitar o CORS de forma global 
cors.originPatterns=http://localhost:8080,http://localhost:8081,http://localhost:19006,http://localhost:3000,http://localhost:8100


server.port=${PORT:8080}